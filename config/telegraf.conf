[agent]
  interval = "10s"
  flush_interval = "2s"
  omit_hostname = true
  metric_batch_size = 100
  metric_buffer_limit = 10000

[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics = ["grp18/devices/+/telemetry", "grp18/devices/+/events"]
  username = "ingest"
  password = "${MQTT_INGEST_PASSWORD}"
  client_id = "group18-telegraf"
  qos = 1
  persistent_session = true
  connection_timeout = "15s"
  tls_ca = "/etc/telegraf/ca.crt"
  insecure_skip_verify = false
  data_format = "json"
  name_override = "glasses"
  tag_keys = ["device_id", "device_model", "sensor_model", "boot_id", "event", "source"]
  json_string_fields = ["timestamp", "recording_id", "reset_reason", "wake_reason"]
  # Time-series index uses server receive time. Device timestamp remains a field,
  # so offline uploads do not overwrite last-seen status with old capture times.

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_WRITE_TOKEN}"
  organization = "group18"
  bucket = "telemetry"
