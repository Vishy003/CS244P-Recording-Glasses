apiVersion: 1
datasources:
  - name: Group18 InfluxDB
    uid: group18-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: group18
      defaultBucket: telemetry
    secureJsonData:
      token: $INFLUX_READ_TOKEN
