[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps = knolleary/PubSubClient@2.8
; Do not hard-code the kit ESP32's serial port: the XIAO uses native USB.

[env:xiao_led_test]
extends = env:xiao_esp32s3
build_src_filter = +<led_test.cpp>

[env:xiao_camera_test]
extends = env:xiao_esp32s3
build_src_filter = +<camera_test.cpp>

[env:xiao_button_capture]
extends = env:xiao_esp32s3
build_src_filter = +<button_capture.cpp>

[env:xiao_button_pin_test]
extends = env:xiao_esp32s3
build_src_filter = +<button_pin_test.cpp>
